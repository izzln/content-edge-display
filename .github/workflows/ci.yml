name: CI

# 每次 push / PR 跑测试并产出成品包（Actions 页面可直接下载）；
# 推送 v* 标签时额外发布 Release，把两个包挂成附件，并打各 Debian 版本的离线依赖包（手动运行也会打）。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# GitHub Actions 会设 CI=true，Makefile 据此不把真实口令打进产物——
# 本仓库是公开的，Actions 产物与 Release 附件谁都能下载。
env:
  CI: "true"

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 跟随 go.mod 的 go 指令，升级时无需改这里
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w：" && echo "$unformatted"
            exit 1
          fi

      # 转码测试需要真实 ffmpeg（含 libx264/libx265），播放进程测试需要 Python + GStreamer
      # （用 fakesink 代替显示、软解代替 cedrus）；没装时那些用例会跳过，所以这里显式装上
      - name: 安装 ffmpeg、poppler（PDF）、qpdf（造加密 PDF）与 GStreamer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg poppler-utils qpdf python3-gi python3-gst-1.0 \
            gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: make test

  package:
    name: 打成品包（v* 标签时发布 Release）
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 版本号取自 git describe（打了标签就是标签名），需要完整历史与标签
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 包名、包内 VERSION 与程序内置版本都来自同一个版本号，服务端上传时会核对三者一致
      - run: make package

      - id: meta
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: 上传成品包
        uses: actions/upload-artifact@v4
        with:
          name: display-packages-${{ steps.meta.outputs.version }}
          path: bin/*.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: 创建 Release 并附上成品包
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" bin/*.tar.gz --title "${{ github.ref_name }}" --generate-notes

  deps:
    name: 离线依赖包 ${{ matrix.codename }}
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 附到 Release
    strategy:
      matrix:
        codename: [trixie, bookworm, noble]   # Armbian 的 Debian/Ubuntu 版本
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - run: make deps DEBIAN=${{ matrix.codename }}
      - uses: actions/upload-artifact@v4
        with:
          name: display-deps-${{ matrix.codename }}
          path: bin/display-deps-*.tar.gz
          retention-days: 90
          if-no-files-found: error
      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" bin/display-deps-*.tar.gz
