<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>显示屏管理后台</title>
<style>
  :root { --line:#ddd; --muted:#888; --accent:#1a6ee0; --bad:#d33; --ok:#2a2; --warn:#c60; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6f8; color:#222; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 16px 0 0; }
  header button.tab { border:none; background:none; padding:6px 10px; cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
  header button.tab.active { border-color:var(--accent); color:var(--accent); font-weight:600; }
  header .right { margin-left:auto; color:var(--muted); font-size:12px; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  h2.sec { font-size:15px; margin:24px 0 8px; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th,td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:#fafafa; font-weight:600; white-space:nowrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .on { background:var(--ok); } .off { background:var(--bad); }
  .muted { color:var(--muted); font-size:12px; }
  .warn { color:var(--warn); font-weight:600; }
  .okc { color:var(--ok); }
  button { padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; margin:1px 4px 1px 0; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  button.sm { padding:1px 6px; font-size:12px; }
  input[type=text], input[type=time], input[type=datetime-local], select, textarea { padding:6px 8px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  textarea { width:100%; min-height:220px; font-family:ui-monospace,monospace; font-size:12px; }
  .row { display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .bar { background:#fff; border:1px solid var(--line); padding:10px 12px; margin-bottom:12px; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; }
  #overlay.show { display:flex; }
  #modal { background:#fff; border-radius:8px; padding:20px; width:100%; max-width:680px; }
  #modal h2 { margin:0 0 14px; font-size:16px; }
  #modal img.preview { max-width:100%; border:1px solid var(--line); margin-top:8px; }
  #modal .actions { margin-top:16px; text-align:right; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 16px; border-radius:6px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:10; }
  .toast.show { opacity:1; }
  .badge { display:inline-block; background:#eef; border-radius:4px; padding:1px 6px; font-size:12px; margin:1px 2px; }
  .badge.global { background:#dfd; }
  .days label { margin-right:6px; font-size:12px; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>显示屏管理后台</h1>
  <button class="tab active" data-tab="devices">设备</button>
  <button class="tab" data-tab="templates">模板与时段</button>
  <button class="tab" data-tab="firmware">程序更新</button>
  <span class="right">操作生效延迟 ≈ 设备轮询间隔 <button onclick="setToken()">设置Token</button></span>
</header>
<main>
  <div id="tab-devices">
    <div class="bar" id="globalBar"></div>
    <table id="devTable"></table>
  </div>
  <div id="tab-templates" style="display:none">
    <div class="bar">
      <b>全局默认模板：</b>
      <select id="globalSel"></select>
      <button class="primary" onclick="saveGlobal()">保存</button>
      <span class="muted">所有设备默认显示此模板；各设备图片区域在"设备 → 图片"里单独指定。</span>
    </div>
    <p><button class="primary" onclick="newSplitTemplate()">新建左右分屏模板</button>
       <button onclick="editTemplateJSON()">新建/编辑(JSON)</button></p>
    <table id="tplTable"></table>
    <h2 class="sec">时段计划 <span class="muted">按顺序匹配第一条命中的时段；无命中用全局默认模板；开始 &gt; 结束表示跨午夜</span></h2>
    <table id="schTable"></table>
    <p><button onclick="addSchedule()">+ 添加时段</button> <button class="primary" onclick="saveSchedules()">保存时段计划</button></p>
  </div>
  <div id="tab-firmware" style="display:none">
    <div class="bar">
      <div class="row">
        <input type="file" id="fwFile">
        版本号 <input type="text" id="fwVersion" placeholder="如 1.2.0 或 git 短哈希">
        备注 <input type="text" id="fwNotes" placeholder="可选">
        <button class="primary" onclick="uploadFirmware()">上传程序</button>
      </div>
      <span class="muted">上传 <code>make agent-arm</code> 产出的 display-agent-armv7；版本号需与二进制内置版本一致（<code>./display-agent -version</code>）。</span>
    </div>
    <table id="fwTable"></table>
  </div>
</main>
<div id="overlay"><div id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const token = () => localStorage.getItem("admin_token") || "";
const DAYS = ["日","一","二","三","四","五","六"];
function setToken() {
  const t = prompt("管理 Token（服务端 server.json 的 admin_token）", token());
  if (t !== null) { localStorage.setItem("admin_token", t.trim()); refresh(); }
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Admin-Token": token(), ...(opts.headers || {}) } });
  if (r.status === 401) { toast("Token 无效，请重新设置"); throw new Error("unauthorized"); }
  if (!r.ok) { const t = await r.text(); toast(t); throw new Error(t); }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}
const J = body => ({ headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3500); }
function modal(html) { $("#modal").innerHTML = html; $("#overlay").classList.add("show"); }
function closeModal() { $("#overlay").classList.remove("show"); }
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.querySelectorAll("header .tab").forEach(b => b.onclick = () => {
  document.querySelectorAll("header .tab").forEach(x => x.classList.toggle("active", x === b));
  for (const t of ["devices", "templates", "firmware"]) $("#tab-" + t).style.display = b.dataset.tab === t ? "" : "none";
});

let devices = [], templates = [], global = {}, schedules = [], firmware = [], uploads = [];
const fmtTime = s => s ? new Date(s).toLocaleString() : "-";
const tplById = id => templates.find(t => t.id === id);
const SOURCE = { test: "测试中", override: "设备覆盖", schedule: "时段", global: "全局", playlist: "目录轮播" };

const arr = v => Array.isArray(v) ? v : [];
async function refresh() {
  try {
    const [d, t, g, s, f, u] = await Promise.all([
      api("/api/v1/admin/devices"), api("/api/v1/admin/templates"), api("/api/v1/admin/global"),
      api("/api/v1/admin/schedules"), api("/api/v1/admin/firmware"), api("/api/v1/admin/uploads")]);
    // 任一接口返回 null/异常类型都不应让整页渲染崩掉（崩掉的表现是按钮全部失效）
    [devices, templates, global, schedules, firmware, uploads] =
      [arr(d), arr(t), g || {}, arr(s), arr(f), arr(u)];
  } catch { return; }
  try {
    renderDevices(); renderTemplates(); renderSchedules(); renderFirmware();
  } catch (e) {
    console.error(e);
    toast("界面渲染出错: " + e.message);
  }
}

// ================= 设备 =================
function renderDevices() {
  const g = tplById(global.template_id);
  $("#globalBar").innerHTML = g
    ? `当前全局默认模板：<b>${esc(g.name)}</b> <span class="muted">(${esc(g.id)})</span>${schedules.length ? `，另有 ${schedules.length} 条时段计划` : ""}`
    : `<span class="warn">尚未设置全局模板</span>——设备将播放各自 media 目录内容。到"模板与时段"页设置。`;
  const rows = devices.map(d => {
    const st = d.online ? '<span class="dot on"></span>在线'
      : `<span class="dot off"></span>离线<div class="muted">最后在线: ${esc(fmtTime(d.last_seen))}</div>`;
    const attrs = Object.entries(d.attrs || {}).map(([k, v]) => `<span class="badge">${esc(k)}=${esc(v)}</span>`).join("") || '<span class="muted">-</span>';
    let show = `<span class="${d.active_source === "test" ? "warn" : ""}">${SOURCE[d.active_source] || d.active_source}</span>`;
    if (d.active_template) show += ` <span class="badge">${esc(d.active_template)}</span>`;
    if (d.test_until) show += `<div class="muted">测试至 ${esc(new Date(d.test_until).toLocaleTimeString())}</div>`;
    if (d.heartbeat) show += `<div class="muted">播放: ${esc((d.heartbeat.playing || "").split("/").pop())}</div>`;
    let ver = `<div class="muted">程序 ${esc(d.agent_version || "?")}`;
    if (d.update_target) {
      const t = d.update_target;
      ver += d.agent_version === t.version
        ? ` <span class="okc">✓ 已更新到 ${esc(t.version)}</span>`
        : ` → <span class="warn">${esc(t.version)}${t.not_before && new Date(t.not_before) > new Date() ? " (定时 " + esc(fmtTime(t.not_before)) + ")" : " (待更新)"}</span>`;
    }
    ver += "</div>";
    const hw = d.hw ? `<div class="muted">${esc(d.hw.hostname || "")} ${esc(d.hw.ip || "")}</div>` : "";
    return `<tr>
      <td>${st}</td>
      <td><b>${esc(d.name)}</b> ${d.registered ? '<span class="badge">自注册</span>' : ""}<div class="muted">${esc(d.id)}</div>${hw}${ver}</td>
      <td>${attrs}</td>
      <td>${show}</td>
      <td>
        <button onclick="testDialog('${esc(d.id)}')">测试</button>
        <button onclick="imagesDialog('${esc(d.id)}')">图片</button>
        <button onclick="attrsDialog('${esc(d.id)}')">属性</button>
        <button onclick="renameDevice('${esc(d.id)}')" ${d.registered ? "" : "disabled title='静态配置设备请改 server.json'"}>改名</button>
        <button onclick="displayDialog('${esc(d.id)}')" class="sm">高级</button>
        <button onclick="deleteDevice('${esc(d.id)}')" class="danger sm" ${d.registered ? "" : "disabled"}>删除</button>
      </td></tr>`;
  }).join("");
  $("#devTable").innerHTML = `<tr><th>状态</th><th>设备</th><th>属性</th><th>当前显示</th><th>操作</th></tr>${rows || '<tr><td colspan="5" class="muted">暂无设备。设备烧录母镜像上电后会自动注册出现在这里。</td></tr>'}`;
}

function testDialog(id) {
  modal(`<h2>测试屏 — ${esc(id)}</h2>
    <p>设备显示屏将全屏显示"测试"卡片（含设备名/属性），用于现场定位。生效与恢复各需等待一个轮询周期。</p>
    <div class="row">
      <button class="primary" onclick="doTest('${esc(id)}',60)">1 分钟</button>
      <button class="primary" onclick="doTest('${esc(id)}',300)">5 分钟</button>
      <button class="primary" onclick="doTest('${esc(id)}',900)">15 分钟</button>
      <button class="danger" onclick="doTest('${esc(id)}',0)">取消测试</button>
    </div><div class="actions"><button onclick="closeModal()">关闭</button></div>`);
}
async function doTest(id, secs) {
  await api(`/api/v1/admin/devices/${id}/test`, { method: "POST", ...J({ duration_s: secs }) });
  toast(secs > 0 ? "已下发测试屏" : "已取消测试"); closeModal(); refresh();
}
async function renameDevice(id) {
  const d = devices.find(x => x.id === id);
  const name = prompt("设备名称", d.name);
  if (name === null || !name.trim()) return;
  await api(`/api/v1/admin/devices/${id}/name`, { method: "PUT", ...J({ name: name.trim() }) });
  toast("已改名"); refresh();
}
async function deleteDevice(id) {
  if (!confirm(`删除设备 ${id}？其属性/图片绑定/更新目标一并删除；设备若仍在线会重新自注册（新密钥）。`)) return;
  await api(`/api/v1/admin/devices/${id}`, { method: "DELETE" });
  toast("已删除"); refresh();
}

// ---- 属性 ----
function attrsDialog(id) {
  const d = devices.find(x => x.id === id);
  const rows = Object.entries(d.attrs || {}).map(([k, v]) => attrRow(k, v)).join("");
  modal(`<h2>设备属性 — ${esc(id)}</h2><div id="attrRows">${rows}</div>
    <p><button onclick="addAttrRow()">+ 添加属性</button> <span class="muted">如 room=302；模板的 attribute 区域按 key 显示对应值</span></p>
    <div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveAttrs('${esc(id)}')">保存</button></div>`);
}
const attrRow = (k = "", v = "") => `<div class="row attr-row"><input type="text" class="k" value="${esc(k)}" placeholder="key"><input type="text" class="v" value="${esc(v)}" placeholder="value"><button onclick="this.parentNode.remove()">删</button></div>`;
function addAttrRow() { $("#attrRows").insertAdjacentHTML("beforeend", attrRow()); }
async function saveAttrs(id) {
  const attrs = {};
  for (const row of document.querySelectorAll(".attr-row")) { const k = row.querySelector(".k").value.trim(); if (k) attrs[k] = row.querySelector(".v").value; }
  await api(`/api/v1/admin/devices/${id}/attributes`, { method: "PUT", ...J(attrs) });
  toast("属性已保存"); closeModal(); refresh();
}

// ---- 图片绑定（针对该设备当前/全局模板及所有时段模板的 image 区域）----
function imagesDialog(id) {
  const d = devices.find(x => x.id === id);
  // 收集该设备可能显示的全部模板的 image 区域（全局 + 时段 + 覆盖），按区域 ID 去重
  const tplIDs = new Set([global.template_id, ...schedules.map(s => s.template_id), d.display.template_id].filter(Boolean));
  const regions = new Map();
  for (const tid of tplIDs) for (const r of (tplById(tid)?.regions || [])) if (r.type === "image" && !regions.has(r.id)) regions.set(r.id, tid);
  window._bindings = { ...(d.display.bindings || {}) };
  const rows = [...regions].map(([rid, tid]) => `<div class="row">图片区域 <b>${esc(rid)}</b> <span class="muted">(模板 ${esc(tid)})</span>:
      <select onchange="window._bindings['${esc(rid)}']=this.value"><option value="">（未绑定）</option>
      ${uploads.map(u => `<option value="${esc(u)}" ${window._bindings[rid] === u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select></div>`).join("");
  modal(`<h2>图片绑定 — ${esc(d.name)}</h2>
    ${rows || '<p class="warn">当前没有含图片区域的模板（先设置全局模板）</p>'}
    <div class="row"><input type="file" id="upFile" accept=".png,.jpg,.jpeg"><button onclick="doUpload(() => imagesDialog('${esc(id)}'))">上传新图片</button></div>
    <div class="row"><button onclick="previewDevice('${esc(id)}')">预览当前模板效果（按已保存配置）</button></div><div id="previewBox"></div>
    <div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveBindings('${esc(id)}')">保存</button></div>`);
}
async function doUpload(after) {
  const f = $("#upFile").files[0];
  if (!f) { toast("请先选择文件"); return; }
  const fd = new FormData(); fd.append("file", f);
  const r = await api("/api/v1/admin/uploads", { method: "POST", body: fd });
  if (!uploads.includes(r.name)) uploads.push(r.name);
  toast("已上传 " + r.name); if (after) after();
}
async function saveBindings(id) {
  const d = devices.find(x => x.id === id);
  const body = { mode: d.display.mode || "playlist", template_id: d.display.template_id, bindings: {} };
  for (const [k, v] of Object.entries(window._bindings)) if (v) body.bindings[k] = v;
  await api(`/api/v1/admin/devices/${id}/display`, { method: "PUT", ...J(body) });
  toast("图片绑定已保存"); closeModal(); refresh();
}
async function previewDevice(id) {
  const d = devices.find(x => x.id === id);
  const tid = d.active_template || global.template_id;
  if (!tid) { toast("该设备当前没有模板"); return; }
  await showPreview(`/api/v1/admin/templates/${tid}/preview?device=${id}`, "#previewBox");
}
async function showPreview(url, target) {
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { headers: { "X-Admin-Token": token() } });
  if (!r.ok) { toast(await r.text()); return; }
  const blob = await r.blob();
  const html = `<img class="preview" src="${URL.createObjectURL(blob)}">`;
  if (target) $(target).innerHTML = html; else modal(`<h2>预览</h2>${html}<div class="actions"><button onclick="closeModal()">关闭</button></div>`);
}

// ---- 高级：设备级模板覆盖 ----
function displayDialog(id) {
  const d = devices.find(x => x.id === id);
  const opts = templates.map(t => `<option value="${esc(t.id)}" ${d.display.template_id === t.id ? "selected" : ""}>${esc(t.name)} (${esc(t.id)})</option>`).join("");
  modal(`<h2>高级：设备级覆盖 — ${esc(id)}</h2>
    <p class="muted">一般不需要。"跟随全局"时设备按全局模板/时段计划显示；"固定模板"则忽略全局与时段，始终显示所选模板。</p>
    <div class="row"><label><input type="radio" name="mode" value="playlist" ${d.display.mode !== "template" ? "checked" : ""}> 跟随全局（无全局模板时播放 media 目录）</label></div>
    <div class="row"><label><input type="radio" name="mode" value="template" ${d.display.mode === "template" ? "checked" : ""}> 固定模板</label> <select id="ovSel">${opts}</select></div>
    <div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveDisplay('${esc(id)}')">保存</button></div>`);
}
async function saveDisplay(id) {
  const d = devices.find(x => x.id === id);
  const mode = document.querySelector('input[name=mode]:checked').value;
  const body = { mode, bindings: d.display.bindings || {} };
  if (mode === "template") { body.template_id = $("#ovSel").value; if (!body.template_id) { toast("请选择模板"); return; } }
  await api(`/api/v1/admin/devices/${id}/display`, { method: "PUT", ...J(body) });
  toast("已保存"); closeModal(); refresh();
}

// ================= 模板 / 全局 / 时段 =================
function renderTemplates() {
  $("#globalSel").innerHTML = `<option value="">（无：设备播放 media 目录）</option>` +
    templates.map(t => `<option value="${esc(t.id)}" ${global.template_id === t.id ? "selected" : ""}>${esc(t.name)} (${esc(t.id)})</option>`).join("");
  const rows = templates.map(t => `<tr>
    <td><b>${esc(t.name)}</b> ${global.template_id === t.id ? '<span class="badge global">全局默认</span>' : ""}<div class="muted">${esc(t.id)} · ${t.w}×${t.h}</div></td>
    <td>${t.regions.map(r => `<span class="badge">${esc(r.id)}:${esc(r.type)}${r.type !== "image" ? "(" + esc(r.key) + ")" : ""}</span>`).join("")}</td>
    <td>
      ${global.template_id === t.id ? "" : `<button onclick="setGlobal('${esc(t.id)}')">设为全局</button>`}
      <button onclick="showPreview('/api/v1/admin/templates/${esc(t.id)}/preview')">预览</button>
      <button onclick="editTemplateJSON('${esc(t.id)}')">编辑</button>
      <button class="danger" onclick="deleteTemplate('${esc(t.id)}')">删除</button>
    </td></tr>`).join("");
  $("#tplTable").innerHTML = `<tr><th>模板</th><th>区域</th><th>操作</th></tr>${rows || '<tr><td colspan="3" class="muted">暂无模板</td></tr>'}`;
}
async function setGlobal(id) { $("#globalSel").value = id; await saveGlobal(); }
async function saveGlobal() {
  await api("/api/v1/admin/global", { method: "PUT", ...J({ template_id: $("#globalSel").value }) });
  toast("全局模板已保存"); refresh();
}
function newSplitTemplate() {
  modal(`<h2>新建左右分屏模板</h2>
    <div class="row">模板 ID <input type="text" id="f_id" placeholder="split-room"></div>
    <div class="row">名称 <input type="text" id="f_name" placeholder="房间号分屏"></div>
    <div class="row">左侧显示属性 key <input type="text" id="f_key" value="room"></div>
    <div class="row">左侧字号 <input type="text" id="f_size" value="160"> 文字色 <input type="text" id="f_color" value="#FFFFFF"> 底色 <input type="text" id="f_bg" value="#1E3A8A"></div>
    <p class="muted">右半屏为图片区域 <b>right</b>，具体图片在各设备"图片"里指定。</p>
    <div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="createSplit()">创建</button></div>`);
}
async function createSplit() {
  const tpl = { id: $("#f_id").value.trim(), name: $("#f_name").value.trim(), w: 1440, h: 900, background: "#000000",
    regions: [
      { id: "left", x: 0, y: 0, w: 720, h: 900, type: "attribute", key: $("#f_key").value.trim(), font_size: parseInt($("#f_size").value) || 160, color: $("#f_color").value.trim(), bg: $("#f_bg").value.trim(), align: "center" },
      { id: "right", x: 720, y: 0, w: 720, h: 900, type: "image" } ] };
  await api("/api/v1/admin/templates", { method: "POST", ...J(tpl) });
  toast("模板已创建"); closeModal(); refresh();
}
function editTemplateJSON(id) {
  const t = tplById(id);
  const sample = t || { id: "my-template", name: "示例", w: 1440, h: 900, background: "#000000",
    regions: [{ id: "r1", x: 0, y: 0, w: 1440, h: 900, type: "text", key: "示例文字", font_size: 96, color: "#FFFFFF", align: "center" }] };
  modal(`<h2>${t ? "编辑" : "新建"}模板 (JSON)</h2><textarea id="tplJSON">${esc(JSON.stringify(sample, null, 2))}</textarea>
    <div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveTemplateJSON()">保存</button></div>`);
}
async function saveTemplateJSON() {
  let tpl; try { tpl = JSON.parse($("#tplJSON").value); } catch (e) { toast("JSON 语法错误: " + e.message); return; }
  await api("/api/v1/admin/templates", { method: "POST", ...J(tpl) });
  toast("模板已保存"); closeModal(); refresh();
}
async function deleteTemplate(id) {
  if (!confirm(`确认删除模板 ${id}？`)) return;
  await api(`/api/v1/admin/templates/${id}`, { method: "DELETE" });
  toast("已删除"); refresh();
}

// ---- 时段计划（整表编辑）----
let schEdit = null;
function renderSchedules() {
  if (schEdit === null) schEdit = schedules.map(s => ({ ...s, days: [...(s.days || [])] }));
  const tplOpts = sel => templates.map(t => `<option value="${esc(t.id)}" ${sel === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  const rows = schEdit.map((s, i) => `<tr>
    <td>${i + 1}</td>
    <td><select onchange="schEdit[${i}].template_id=this.value">${tplOpts(s.template_id)}</select></td>
    <td class="days">${DAYS.map((d, k) => `<label><input type="checkbox" ${s.days.includes(k) ? "checked" : ""} onchange="toggleDay(${i},${k},this.checked)">${d}</label>`).join("")}<div class="muted">全不勾 = 每天</div></td>
    <td><input type="time" value="${esc(s.start)}" onchange="schEdit[${i}].start=this.value"></td>
    <td><input type="time" value="${esc(s.end)}" onchange="schEdit[${i}].end=this.value"></td>
    <td><button class="sm" onclick="moveSch(${i},-1)">↑</button><button class="sm" onclick="moveSch(${i},1)">↓</button><button class="sm danger" onclick="schEdit.splice(${i},1);renderSchedules()">删</button></td>
  </tr>`).join("");
  $("#schTable").innerHTML = `<tr><th>#</th><th>模板</th><th>星期</th><th>开始</th><th>结束</th><th></th></tr>${rows || '<tr><td colspan="6" class="muted">无时段计划：全天显示全局默认模板</td></tr>'}`;
}
function toggleDay(i, k, on) { const d = schEdit[i].days; const idx = d.indexOf(k); if (on && idx < 0) d.push(k); if (!on && idx >= 0) d.splice(idx, 1); }
function moveSch(i, delta) { const j = i + delta; if (j < 0 || j >= schEdit.length) return; [schEdit[i], schEdit[j]] = [schEdit[j], schEdit[i]]; renderSchedules(); }
function addSchedule() {
  if (!templates.length) { toast("请先创建模板"); return; }
  schEdit.push({ template_id: templates[0].id, days: [], start: "08:00", end: "18:00" }); renderSchedules();
}
async function saveSchedules() {
  const body = schEdit.map(s => ({ id: s.id, template_id: s.template_id, days: s.days.slice().sort(), start: s.start, end: s.end }));
  await api("/api/v1/admin/schedules", { method: "PUT", ...J(body) });
  toast("时段计划已保存"); schEdit = null; refresh();
}

// ================= 程序更新 =================
function renderFirmware() {
  const rows = firmware.map(f => `<tr>
    <td><b>${esc(f.version)}</b><div class="muted">${esc(f.notes || "")}</div></td>
    <td>${(f.size / 1048576).toFixed(1)} MB<div class="muted">sha256 ${esc(f.sha256.slice(0, 12))}…</div></td>
    <td>${esc(fmtTime(f.uploaded_at))}</td>
    <td>${devices.filter(d => d.agent_version === f.version).length} / ${devices.length} 台在用</td>
    <td><button class="primary" onclick="rolloutDialog('${esc(f.version)}')">下发</button>
        <button class="danger" onclick="deleteFirmware('${esc(f.version)}')">删除</button></td></tr>`).join("");
  $("#fwTable").innerHTML = `<tr><th>版本</th><th>大小</th><th>上传时间</th><th>覆盖</th><th>操作</th></tr>${rows || '<tr><td colspan="5" class="muted">尚未上传程序</td></tr>'}`;
}
async function uploadFirmware() {
  const f = $("#fwFile").files[0], v = $("#fwVersion").value.trim();
  if (!f || !v) { toast("请选择文件并填写版本号"); return; }
  const fd = new FormData(); fd.append("file", f); fd.append("version", v); fd.append("notes", $("#fwNotes").value);
  await api("/api/v1/admin/firmware", { method: "POST", body: fd });
  toast("已上传 " + v); $("#fwVersion").value = ""; $("#fwNotes").value = ""; refresh();
}
async function deleteFirmware(v) {
  if (!confirm(`删除程序版本 ${v}？`)) return;
  await api(`/api/v1/admin/firmware/${v}`, { method: "DELETE" }); toast("已删除"); refresh();
}
function rolloutDialog(version) {
  const devOpts = devices.map(d => `<label style="display:block"><input type="checkbox" class="rl-dev" value="${esc(d.id)}"> ${esc(d.name)} <span class="muted">${esc(d.id)} · 当前 ${esc(d.agent_version || "?")}</span></label>`).join("");
  modal(`<h2>下发程序 ${esc(version)}</h2>
    <div class="row"><label><input type="radio" name="when" value="now" checked> 立即</label>
      <label><input type="radio" name="when" value="at"> 定时</label> <input type="datetime-local" id="rlAt"></div>
    <div class="row"><label><input type="radio" name="who" value="all" checked> 全部设备</label>
      <label><input type="radio" name="who" value="some"> 指定设备：</label></div>
    <div style="max-height:200px;overflow:auto;border:1px solid var(--line);padding:6px">${devOpts}</div>
    <p class="muted">设备在轮询时取到指令 → 下载校验 → 切换重启；新版本首个心跳成功即确认，连续 3 次启动失败自动回滚。</p>
    <div class="actions"><button onclick="closeModal()">取消</button>
      <button class="danger" onclick="doRollout('', true)">取消所有待更新</button>
      <button class="primary" onclick="doRollout('${esc(version)}')">下发</button></div>`);
}
async function doRollout(version, cancel = false) {
  const body = { version };
  if (!cancel) {
    if (document.querySelector('input[name=when]:checked').value === "at") {
      const at = $("#rlAt").value; if (!at) { toast("请选择定时时间"); return; }
      body.not_before = new Date(at).toISOString();
    }
    if (document.querySelector('input[name=who]:checked').value === "some") {
      body.devices = [...document.querySelectorAll(".rl-dev:checked")].map(x => x.value);
      if (!body.devices.length) { toast("请勾选设备"); return; }
    }
  }
  await api("/api/v1/admin/rollout", { method: "PUT", ...J(body) });
  toast(cancel ? "已取消待更新" : "已下发"); closeModal(); refresh();
}

refresh();
setInterval(() => { if (!$("#overlay").classList.contains("show")) refresh(); }, 10000);
if (!token()) setToken();
</script>
</body>
</html>
